{% extends "base.html" %}

{% block title %}Page Not Found — ChildInsight{% endblock %}

{% block content %}
<div class="error-page">
    <div class="card" style="padding: 3rem 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
        <div style="font-size: 3rem; margin-bottom: 0.5rem;">🧭</div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you are looking for does not exist, has been moved, or is temporarily unavailable.</p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a href="javascript:history.back()" class="btn btn-outline">Go Back</a>
            <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Return to Homepage</a>
        </div>
    </div>
</div>
{% endblock %}
